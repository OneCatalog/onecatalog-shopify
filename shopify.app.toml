# Конфиг Shopify-приложения. client_id выдаётся в Partner Dashboard (shopify app config link).
client_id = "REPLACE_WITH_CLIENT_ID"
name = "OneCatalog Import"
handle = "onecatalog-import"
application_url = "https://example.com"
embedded = true

[access_scopes]
scopes = "write_products,read_products,write_inventory,read_inventory,write_publications,read_publications"

[auth]
redirect_urls = [ "https://example.com/auth/callback", "https://example.com/auth/shopify/callback", "https://example.com/api/auth/callback" ]

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[pos]
embedded = false
